<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a36">
  <title>NUWIL Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="logo.jpg" alt="NUWIL">
      <div>
        <strong>NUWIL</strong>
        <span>Frozen & Seafood</span>
      </div>
    </div>

    <nav id="nav">
      <button class="nav-item active" data-page="dashboard"><span>⌂</span> Dashboard</button>
      <button class="nav-item" data-page="inventory"><span>▣</span> Inventory</button>
      <button class="nav-item" data-page="purchases"><span>↓</span> Pembelian</button>
      <button class="nav-item" data-page="processing"><span>⚙</span> Sorting / Processing</button>
      <button class="nav-item" data-page="production"><span>◆</span> Produksi</button>
      <button class="nav-item" data-page="supply"><span>→</span> Supply Toka</button>
      <button class="nav-item" data-page="finance"><span>Rp</span> Finance</button>
      <div class="nav-label">MASTER DATA</div>
      <button class="nav-item" data-page="products"><span>□</span> Produk</button>
      <button class="nav-item" data-page="categories"><span>≡</span> Kategori</button>
      <button class="nav-item" data-page="suppliers"><span>♙</span> Supplier</button>
      <button class="nav-item" data-page="customers"><span>♧</span> Customer</button>
    </nav>

    <div class="sidebar-foot">
      <span class="dot"></span> Sistem online
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Ringkasan kondisi NUWIL</p>
        </div>
      </div>
      <div class="top-right">
        <span id="status" class="status"><i></i> Connecting...</span>
        <span id="today" class="today"></span>
      </div>
    </header>

    <section id="app"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
