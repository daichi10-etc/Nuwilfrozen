<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b2a55">
  <title>NUWIL Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="site-header">
    <div class="header-brand">
      <img src="logo.jpg" alt="NUWIL">
      <div class="brand-copy">
        <strong>NUWIL</strong>
        <span>FROZEN & SEAFOOD</span>
      </div>
    </div>

    <button class="mobile-menu" id="mobileMenu" aria-label="Menu">☰</button>

    <nav class="main-nav" id="mainNav">
      <button class="nav-item active" data-page="dashboard"><span>⌂</span>Dashboard</button>
      <button class="nav-item" data-page="inventory"><span>▦</span>Inventory</button>
      <button class="nav-item" data-page="purchases"><span>↓</span>Pembelian</button>
      <button class="nav-item" data-page="processing"><span>⚙</span>Sorting / Processing</button>
      <button class="nav-item" data-page="production"><span>◆</span>Produksi</button>
      <button class="nav-item" data-page="supply"><span>→</span>Supply Toka</button>
      <button class="nav-item" data-page="finance"><span>Rp</span>Finance</button>
      <button class="nav-item" data-page="products"><span>□</span>Produk</button>
      <button class="nav-item" data-page="categories"><span>≡</span>Kategori</button>
      <button class="nav-item" data-page="suppliers"><span>♙</span>Supplier</button>
      <button class="nav-item" data-page="customers"><span>♧</span>Customer</button>
    </nav>

    <div class="header-right">
      <div class="connection"><i></i><span id="status">Connecting...</span></div>
      <div class="user-chip">
        <div class="avatar">D</div>
        <div>
          <strong>Owner</strong>
          <span>NUWIL Management</span>
        </div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="page-heading">
      <div>
        <div class="eyebrow">NUWIL MANAGEMENT SYSTEM</div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Ringkasan kondisi usaha dan persediaan.</p>
      </div>
      <div class="date-box">
        <span>Hari ini</span>
        <strong id="today"></strong>
      </div>
    </div>

    <section id="app"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
