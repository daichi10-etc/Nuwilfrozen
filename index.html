<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUWIL Management</title>
<style>
:root{--mint:#32c48d;--mint2:#1fa774;--charcoal:#17211d;--charcoal2:#202c27;--bg:#f5f8f6;--line:#e2e9e5;--text:#18221e;--muted:#78857f;--green:#1fa774;--red:#d94b35;--shadow:0 10px 28px rgba(23,33,29,.07)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}button,input{font:inherit}button{cursor:pointer}
.layout{display:flex;min-height:100vh}.sidebar{width:245px;position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,#17211d,#202c27);color:#fff;padding:24px 15px;z-index:30;box-shadow:8px 0 30px rgba(64,38,17,.12)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 24px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px}.brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:13px;padding:3px}.brand strong{font-size:20px;letter-spacing:1.4px}.brand span{display:block;font-size:8px;letter-spacing:1.2px;color:#b8cbc3;margin-top:3px;font-weight:800}
.menu-label{font-size:8px;color:#9fb1a9;letter-spacing:1.5px;font-weight:800;padding:0 11px 8px;margin-top:14px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#d5e0db;text-align:left;padding:11px 12px;border-radius:10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:10px;transition:.16s}.nav button:hover{background:rgba(255,255,255,.08);color:#fff}.nav button.active{background:var(--mint);color:#fff;box-shadow:0 6px 16px rgba(50,196,141,.22)}.ico{width:22px;text-align:center;font-size:13px}.sidebar-bottom{position:absolute;left:15px;right:15px;bottom:18px;border-top:1px solid rgba(255,255,255,.1);padding:14px 10px 0;color:#9fb1a9;font-size:9px;line-height:1.6}
.content{margin-left:245px;width:calc(100% - 245px);min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.top-left strong{font-size:18px;color:var(--charcoal)}.top-left span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.top-right{display:flex;align-items:center;gap:16px}.connection{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#b8afa3}.dot.on{background:var(--green)}.dot.off{background:var(--red)}.user{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:6px 10px;background:#fff}.avatar{width:31px;height:31px;border-radius:9px;background:#fff1d6;color:var(--charcoal);display:grid;place-items:center;font-weight:800}.user b{font-size:10px;display:block}.user span{font-size:8px;color:var(--muted);display:block;margin-top:2px}
.main{max-width:1500px;margin:auto;padding:28px 30px 50px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.eyebrow{font-size:9px;letter-spacing:1.6px;font-weight:800;color:var(--amber)}h1{font-size:29px;color:var(--charcoal);letter-spacing:-.7px;margin-top:4px}.subtitle{font-size:11px;color:var(--muted);margin-top:5px}.date{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;text-align:right;font-size:9px;color:var(--muted)}.date b{display:block;color:var(--charcoal);font-size:10px;margin-top:3px}
.hero{background:linear-gradient(110deg,#5a371b,#7b4d22 62%,#b87516);border-radius:18px;color:#fff;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative;box-shadow:0 12px 30px rgba(90,55,27,.15);margin-bottom:18px}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-120px;background:rgba(255,255,255,.08)}.hero h2{font-size:23px;position:relative;z-index:1}.hero p{font-size:11px;color:#f3e5d4;max-width:700px;line-height:1.65;margin-top:6px;position:relative;z-index:1}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;position:relative;z-index:1}.pill{font-size:9px;padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}.hero-logo{width:105px;height:105px;object-fit:contain;background:#fff;border-radius:24px;padding:7px;position:relative;z-index:1}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.label{font-size:10px;color:var(--muted);font-weight:700}.icon{width:32px;height:32px;border-radius:9px;background:#e9f7f0;color:var(--amber);display:grid;place-items:center;font-size:12px;font-weight:900}.value{font-size:21px;font-weight:800;color:var(--charcoal);letter-spacing:-.5px}.note{font-size:9px;color:#a29586;margin-top:5px}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.panel-title{font-size:14px;font-weight:800;color:var(--charcoal)}.panel-sub{font-size:9px;color:var(--muted);margin-top:4px}.rows .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0eae2;font-size:11px}.rows .row:last-child{border-bottom:0}.rows span{color:var(--muted)}.rows b{color:var(--charcoal)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{border:1px solid var(--line);background:#fff;text-align:left;border-radius:11px;padding:13px}.quick button:hover{border-color:#efc77c;background:#fffaf2}.quick b{display:block;color:var(--charcoal);font-size:11px}.quick span{display:block;color:var(--muted);font-size:9px;line-height:1.5;margin-top:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.search{width:320px;max-width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:11px}.search:focus{border-color:#efc77c;box-shadow:0 0 0 3px rgba(233,154,24,.08)}.btn{border:0;border-radius:9px;padding:10px 14px;font-size:10px;font-weight:800}.primary{background:var(--mint);color:#fff}.primary:hover{background:#d98c10}.soft{background:#e9f7f0;color:var(--charcoal)}
.tablebox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;font-size:10px}th{background:#fbfcfb;color:#8a7d6e;text-align:left;padding:12px;font-size:9px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #f0eae2;white-space:nowrap}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:800;background:#e9f7f0;color:#12845d}.empty{background:#fbfcfb;border:1px dashed #dce6e1;border-radius:11px;padding:30px;text-align:center;color:#a29586;font-size:11px;line-height:1.7}.error{background:#fff0ed;color:#b42318;border-radius:11px;padding:15px;font-size:11px}
.modal-bg{position:fixed;inset:0;background:rgba(23,33,29,.48);display:grid;place-items:center;padding:18px;z-index:99;overflow:auto}.modal{background:#fff;width:min(560px,100%);max-height:calc(100vh - 36px);overflow-y:auto;border-radius:16px;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.22)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head b{font-size:16px;color:var(--charcoal)}.close{border:0;background:#edf2ef;border-radius:50%;width:30px;height:30px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:700;color:#64736c}.field input{border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:20px;bottom:20px;background:var(--charcoal);color:#fff;border-radius:10px;padding:11px 14px;font-size:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:120}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.sidebar{width:210px}.content{margin-left:210px;width:calc(100% - 210px)}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top-right .user{display:none}}@media(max-width:700px){.sidebar{position:fixed;transform:translateX(-100%);transition:.2s;width:245px}.sidebar.open{transform:none}.content{margin-left:0;width:100%}.topbar{padding:0 16px}.mobile{display:block!important}.main{padding:20px 14px 40px}.heading{align-items:flex-start}.date{display:none}.cards{grid-template-columns:1fr}.hero-logo{display:none}.quick{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.search{width:100%}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}.mobile{display:none;border:0;background:#e9f7f0;color:var(--charcoal);border-radius:9px;padding:8px 10px;font-size:16px}
</style>
<style>
:root{--mint:#32c48d;--mint2:#1fa774;--charcoal:#17211d;--charcoal2:#202c27;--bg:#f5f8f6;--line:#e2e9e5;--text:#18221e;--muted:#78857f;--shadow:0 10px 28px rgba(23,33,29,.07)}
.sidebar{background:linear-gradient(180deg,#17211d 0%,#202c27 100%)}
.brand{padding-bottom:22px}
.brand img{box-shadow:0 5px 18px rgba(0,0,0,.14)}
.nav button.active{background:linear-gradient(135deg,#32c48d,#1fa774);box-shadow:0 8px 20px rgba(50,196,141,.20)}
.nav button:hover{background:rgba(50,196,141,.10)}
.topbar{background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
.top-left strong{color:#17211d}
.heading h1{letter-spacing:-.6px}
.card{border:1px solid #e3ebe7;box-shadow:0 8px 24px rgba(23,33,29,.055)}
.card .icon{background:#e9f7f0;color:#1fa774}
.btn.primary{background:linear-gradient(135deg,#32c48d,#1fa774);box-shadow:0 7px 16px rgba(50,196,141,.18)}
.btn.soft{background:#edf3f0;color:#34423c}
.panel{border:1px solid #e3ebe7;box-shadow:0 8px 24px rgba(23,33,29,.045)}
.hero{background:linear-gradient(135deg,#17211d,#26372f)!important;border:1px solid #2f443a;box-shadow:0 14px 32px rgba(23,33,29,.12)}
.pill{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.12)!important}
.connection .dot.on{background:#32c48d;box-shadow:0 0 0 4px rgba(50,196,141,.12)}
</style>

<style>
/* NUWIL employee-friendly UX layer */
.form select,.form textarea,.form input{border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;outline:0;background:#fff;color:var(--text)}
.form textarea{min-height:80px;resize:vertical}
.helper{font-size:9px;color:var(--muted);line-height:1.5}
.form-section{grid-column:1/-1;background:#f7faf8;border:1px solid #e3ebe7;border-radius:10px;padding:12px}
.form-section b{font-size:10px;color:var(--charcoal)}
.inline-add{display:flex;gap:7px;align-items:end}
.inline-add .field{flex:1}
.btn.mini{padding:8px 10px;font-size:9px}
.hidden-tech{display:none!important}
.select-wrap{display:flex;gap:7px}
.select-wrap select{flex:1}
.quick-note{background:#edf8f3;border:1px solid #d5eee4;border-radius:10px;padding:11px;font-size:10px;color:#426257;line-height:1.55;margin-bottom:12px}
.detail-card{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.detail-card .muted{color:var(--muted);font-size:9px}
.detail-card b{font-size:12px}
.prod-input .field input[readonly]{background:#f7faf8;color:#42534b;font-weight:700}.prod-input .pi-lot{width:100%}.prod-input .quick-note{margin-bottom:0}
<style>
.cost-extra-box{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.cost-extra-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.cost-extra-head b{font-size:11px;color:var(--charcoal)}
.cost-extra-empty{font-size:9px;color:var(--muted);padding:9px 0}
.extra-cost-row{padding:7px 0;border-top:1px solid #edf2ef}
.extra-cost-grid{display:grid;grid-template-columns:1.3fr .8fr auto;gap:7px;align-items:center}
.extra-cost-grid input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;outline:0;background:#fff;color:var(--text)}
.btn.danger{background:#fff0ed;color:#b42318;border:1px solid #f4d0ca}
@media(max-width:700px){.extra-cost-grid{grid-template-columns:1fr auto}.extra-cost-grid .extra-cost-amount{grid-column:1}.extra-cost-grid .danger{grid-column:2;grid-row:1/3}}
</style>

</head>

const app=document.getElementById('app'),statusEl=document.getElementById('status'),dot=document.getElementById('dot'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),toastEl=document.getElementById('toast');

const TABLE_MAP={
  MST_SUPPLIER:'SUPPLIER',MST_PRODUCT:'PRODUK',MST_CUSTOMER:'PELANGGAN',MST_UNIT:'SATUAN',
  PURCHASE:'PEMBELIAN',PURCHASE_DETAIL:'DETAIL_PEMBELIAN',LOT:'STOK',STOCK_MOVEMENT:'MUTASI_STOK',
  SUPPLY:'SUPPLY_TOKA',SUPPLY_DETAIL:'DETAIL_SUPPLY_TOKA',FINANCE_TRANSACTION:'TRANSAKSI_KEUANGAN',
  FINANCE_LEDGER:'JURNAL_KEUANGAN',MST_ACCOUNT:'AKUN_KEUANGAN'
};
function normalizeRow(table,r){
  if(!r)return r;
  if(table==='SUPPLIER')return {...r,code:r.kode,name:r.nama_supplier,phone:r.telepon,address:r.alamat};
  if(table==='PRODUK')return {...r,code:r.kode,name:r.nama_produk,product_type:r.jenis,min_stock:r.stok_minimum,status:r.status};
  if(table==='PELANGGAN')return {...r,code:r.kode,name:r.nama_pelanggan,customer_type:r.jenis,status:r.status};
  if(table==='SATUAN')return {...r,code:r.kode,name:r.nama_satuan,decimals:r.desimal,status:r.status};
  if(table==='PEMBELIAN')return {...r,purchase_code:r.no_pembelian,purchase_date:r.tanggal,total_amount:r.total,payment_status:r.status_pembayaran,notes:r.catatan};
  if(table==='STOK')return {...r,lot_code:r.no_lot,product_id:r.produk_id,qty_in:r.qty_awal,qty_current:r.qty_saat_ini,unit_id:r.satuan_id,unit_cost:r.hpp,total_cost:r.total_nilai};
  if(table==='MUTASI_STOK')return {...r,movement_code:r.no_mutasi,movement_date:r.tanggal,product_id:r.produk_id,lot_id:r.no_lot,movement_type:r.jenis_mutasi,qty_in:r.masuk,qty_out:r.keluar,reference:r.referensi};
  if(table==='SUPPLY_TOKA')return {...r,supply_code:r.no_supply,supply_date:r.tanggal,total_amount:r.total_penjualan,total_cost:r.total_hpp,gross_profit:r.laba_kotor,payment_status:r.status_pembayaran,notes:r.catatan};
  if(table==='DETAIL_SUPPLY_TOKA')return {...r,supply_id:r.supply_id,product_id:r.produk_id,lot_batch:r.lot_batch,unit_id:r.satuan_id,unit_price:r.harga_jual,total_price:r.total_jual,total_cost:r.total_hpp};
  if(table==='TRANSAKSI_KEUANGAN')return {...r,transaction_code:r.no_transaksi,transaction_date:r.tanggal,transaction_type:r.jenis,account_id:r.akun,amount:(Number(r.masuk)||0)+(Number(r.keluar)||0),direction:(Number(r.masuk)||0)>0?'IN':'OUT',description:r.keterangan};
  if(table==='JURNAL_KEUANGAN')return {...r,ledger_date:r.tanggal,journal_code:r.no_jurnal,account_id:r.akun};
  if(table==='AKUN_KEUANGAN')return {...r,code:r.kode_akun,name:r.nama_akun,account_type:r.jenis_akun};
  return r;
}
function legacyTable(t){return TABLE_MAP[t]||t}
async function get(p){const q={...p};if(q.table)q.table=legacyTable(q.table);const r=await fetch(API+'?'+new URLSearchParams(q),{cache:'no-store'});const j=await r.json();if(!j.ok)throw Error(j.error||'Backend error');if(q.action==='list'&&Array.isArray(j.data?.rows))j.data.rows=j.data.rows.map(x=>normalizeRow(q.table,x));if(q.action==='dashboard'&&j.data){j.data.inventoryValue=j.data.inventory;j.data.supplyThisMonth=j.data.salesMonth;j.data.activeLots=j.data.purchaseCount+j.data.productionCount;j.data.productionBatches=j.data.productionCount}return j}
async function post(p){
  const x={...p,data:{...(p.data||{})}};
  if(p.action==='create'&&p.table){
    const t=legacyTable(p.table),d=x.data;
    if(t==='SUPPLIER'){x.action='create_supplier';x.nama_supplier=d.name;x.telepon=d.phone;x.alamat=d.address;delete x.data}
    else if(t==='PRODUK'){x.action='create_product';x.nama_produk=d.name;x.kategori=d.category_id||d.category||'';x.satuan=d.unit_id||d.unit||'';x.jenis=d.product_type||'Bahan Baku';x.stok_minimum=d.min_stock||0;delete x.data}
    else if(t==='PELANGGAN'){x.action='create_customer';x.nama_pelanggan=d.name;x.jenis=d.customer_type||'Eksternal';delete x.data}
    else if(t==='SATUAN'){x.action='create_unit';x.nama_satuan=d.name;x.desimal=d.decimals||0;delete x.data}
    else if(t==='PEMBELIAN'){
      x.action='create_purchase';x.supplier_id=d.supplier_id;x.produk_id=d.product_id;x.satuan_id=d.unit_id;x.qty=d.actual_qty;x.harga=Number(d.total_amount||0)/(Number(d.actual_qty)||1);x.status_pembayaran=d.payment_status==='PAID'?'Lunas':d.payment_status==='PARTIAL'?'Sebagian':'Belum Lunas';x.jumlah_dibayar=d.payment_status==='PAID'?Number(d.total_amount||0):0;x.catatan=d.notes||'';delete x.data
    } else if(t==='SUPPLY_TOKA'){
      x.action='create_supply';x.lot_batch=d.lot_batch;x.qty=d.qty;x.harga_jual=d.unit_price||d.harga_jual;x.status_pembayaran=d.payment_status||'Belum Lunas';x.jumlah_dibayar=d.payment_status==='PAID'?Number(d.total_amount||0):0;x.catatan=d.notes||'';delete x.data
    } else if(t==='TRANSAKSI_KEUANGAN'){
      x.action='create_finance';x.amount=d.amount;x.direction=d.direction;x.akun=d.account_id||'CASH';x.jenis=d.transaction_type||'Manual';x.tanggal=d.transaction_date;x.keterangan=d.description||'';delete x.data
    }
  }
  const r=await fetch(API,{method:'POST',body:JSON.stringify(x)});const j=await r.json();if(!j.ok)throw Error(j.error||'Backend error');return j
}
function conn(s){dot.className='dot '+(s==='on'?'on':s==='off'?'off':'');statusEl.textContent=s==='on'?'Online':s==='off'?'Offline':'Connecting...'}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('sidebar').classList.remove('open');title.textContent=pages[page][0];subtitle.textContent=pages[page][1];if(page==='dashboard')return dashboard();if(page==='inventory')return inventory();if(masters[page])return master(page);return modulePage(page)}
function money(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0)}function num(v){return new Intl.NumberFormat('id-ID',{maximumFractionDigits:3}).format(Number(v)||0)}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function label(s){return String(s).replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase())}function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove('show'),2400)}
function card(a,b,c,i){return `<div class="card"><div class="card-top"><span class="label">${a}</span><div class="icon">${i}</div></div><div class="value">${b}</div><div class="note">${c}</div></div>`}

iv></div>`}catch(e){conn('off');app.innerHTML=`<div class="error">${esc(e.message)}</div>`}}

async function saveMaster(page){const c=masters[page],data={};document.querySelectorAll('#modal input').forEach(x=>data[x.id.slice(2)]=x.value.trim());if(!data.name){toast('Nama wajib diisi');return}data.status='ACTIVE';if(page==='products'){data.category_id='';data.unit_id='';data.product_type='RAW';data.track_lot=true;data.track_batch=false;data.min_stock=Number(data.min_stock||0)}try{await post({action:'create',table:c.table,data});closeModal();toast('Data tersimpan');master(page)}catch(e){toast(e.message)}}function closeModal(){document.getElementById('modal')?.remove()}

/* ===== EMPLOYEE-FRIENDLY MODULES ===== */
const cache={};
async function loadMasterRows(table){
  if(cache[table]) return cache[table];
  const j=await get({action:'list',table,limit:500});
  cache[table]=j.data?.rows||[];
  return cache[table];
}
function humanCode(prefix){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${prefix}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${String(Date.now()).slice(-3)}`;
}
function selectOptions(rows,valueField,labelFn,empty='Pilih...'){
  return `<option value="">${empty}</option>`+rows.map(r=>`<option value="${esc(r[valueField]??'')}">${esc(labelFn(r))}</option>`).join('');
}
async function loadAvailableLots(products=[]){
  const j=await get({action:'list',table:'LOT',limit:1000});
  const rows=(j.data?.rows||[]).filter(x=>Number(x.qty_current||0)>0);
  const pm=Object.fromEntries(products.map(x=>[x.id,x]));
  return rows.map(x=>({...x,product_name:pm[x.product_id]?.name||x.product_id||'Produk'}));
}
function lotOptions(rows,empty='Pilih lot yang masih tersedia...'){
  return `<option value="">${empty}</option>`+rows.map(r=>{
    const qty=num(r.qty_current),unit=r.unit_id||'',hpp=money(r.unit_cost);
    return `<option value="${esc(r.id||'')}" data-qty="${Number(r.qty_current)||0}" data-unit="${esc(unit)}" data-hpp="${Number(r.unit_cost)||0}" data-product="${esc(r.product_id||'')}">${esc(`${r.lot_code||'-'} • ${r.product_name||'Produk'} • ${qty} ${unit} • HPP ${hpp}`)}</option>`;
  }).join('');
}
function fieldHTML(id,labelText,type='text',opts=''){
  if(type==='select') return `<div class="field"><label>${labelText}</label><select id="f_${id}">${opts}</select></div>`;
  if(type==='textarea') return `<div class="field full"><label>${labelText}</label><textarea id="f_${id}" placeholder="Opsional"></textarea></div>`;
  return `<div class="field"><label>${labelText}</label><input id="f_${id}" type="${type}"></div>`;
}
function openEmployeeModal(titleText,body,saveFn){
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><b>${titleText}</b><button class="close" onclick="closeModal()">×</button></div>${body}<div class="modal-actions"><button class="btn soft" onclick="closeModal()">Batal</button><button class="btn primary" id="modalSave">Simpan</button></div></div></div>`);
  const saveBtn=document.getElementById('modalSave');
  let saving=false;
  saveBtn.onclick=async()=>{
    if(saving)return;
    saving=true;
    saveBtn.disabled=true;
    saveBtn.textContent='Menyimpan...';
    saveBtn.style.pointerEvents='none';
    try{
      await saveFn();
    }finally{
      if(document.getElementById('modalSave')===saveBtn){
        saving=false;
        saveBtn.disabled=false;
        saveBtn.textContent='Simpan';
        saveBtn.style.pointerEvents='';
      }
    }
  };
}
function clearCache(){Object.keys(cache).forEach(k=>delete cache[k])}

function getPurchaseExtraCosts(){
  return [...document.querySelectorAll('#purchaseExtraCosts .extra-cost-row')].map(row=>({
    name:(row.querySelector('.extra-cost-name')?.value||'').trim(),
    amount:Number(row.querySelector('.extra-cost-amount')?.value||0)
  })).filter(x=>x.name||x.amount>0);
}
function updatePurchaseExtraCosts(){
  const box=document.getElementById('purchaseExtraCosts');
  const empty=document.getElementById('purchaseExtraEmpty');
  if(empty)empty.style.display=box&&box.children.length?'none':'block';
  if(typeof window.updatePurchaseCost==='function')window.updatePurchaseCost();
  else if(typeof updatePurchaseCost==='function')updatePurchaseCost();
}
function addPurchaseExtraCost(){
  const box=document.getElementById('purchaseExtraCosts');
  if(!box)return;
  const row=document.createElement('div');
  row.className='extra-cost-row';
  row.innerHTML=`<div class="extra-cost-grid">
    <input class="extra-cost-name" placeholder="Contoh: Transport, Parkir, Es, Bongkar...">
    <input class="extra-cost-amount" type="number" min="0" step="1" placeholder="Nominal">
    <button class="btn danger mini" type="button" title="Hapus">×</button>
  </div>`;
  box.appendChild(row);
  const name=row.querySelector('.extra-cost-name');
  const amount=row.querySelector('.extra-cost-amount');
  name.addEventListener('input',updatePurchaseExtraCosts);
  amount.addEventListener('input',updatePurchaseExtraCosts);
  row.querySelector('button').onclick=()=>{row.remove();updatePurchaseExtraCosts()};
  name.focus();
  updatePurchaseExtraCosts();
}

async function purchaseForm(){
  try{
    const [suppliers,products,units]=await Promise.all([
      loadMasterRows('MST_SUPPLIER'),loadMasterRows('MST_PRODUCT'),loadMasterRows('MST_UNIT')
    ]);
    const unitOpts=selectOptions(units,'id',x=>x.name||x.code,'Pilih satuan...');
    openEmployeeModal('Pembelian Bahan Baku',
      `<div class="quick-note"><b>Harga bisa diinput sebagai total transaksi atau harga per satuan.</b><br>Kalau supplier memberi harga langsung, misalnya 7,010 kg = Rp320.000, pilih <b>Total Pembelian</b>. HPP per satuan dihitung otomatis oleh sistem.</div>
       <div class="form">
        ${fieldHTML('supplier','Supplier','select',selectOptions(suppliers,'id',x=>x.name,'Pilih supplier...'))}
        <div class="field"><label></label><button class="btn soft mini" type="button" onclick="supplierForm()">+ Supplier Baru</button></div>
        ${fieldHTML('purchase_date','Tanggal','date')}
        ${fieldHTML('product','Barang','select',selectOptions(products,'id',x=>x.name,'Pilih barang...'))}
        ${fieldHTML('qty_invoice','Qty Invoice','number')}
        ${fieldHTML('qty_actual','Qty Aktual','number')}
        ${fieldHTML('unit','Satuan','select',unitOpts)}
        ${fieldHTML('price_mode','Cara Input Harga','select','<option value="UNIT">Harga per Satuan</option><option value="TOTAL">Total Pembelian</option>')}
        <div class="field" id="unitPriceField">${fieldHTML('unit_price','Harga per Satuan','number')}</div>
        <div class="field" id="totalPriceField" style="display:none">${fieldHTML('total_purchase','Total Pembelian','number')}</div>
        <div class="field full"><div class="quick-note" id="effectiveUnitPrice">HPP barang per satuan: Rp0</div></div>
        <div class="field full">
          <div class="cost-extra-box">
            <div class="cost-extra-head">
              <div><b>Biaya Tambahan</b><div class="helper">Opsional. Tambahkan satu per satu sesuai kebutuhan.</div></div>
              <button class="btn soft mini" type="button" onclick="addPurchaseExtraCost()">+ Tambah Biaya</button>
            </div>
            <div id="purchaseExtraCosts"></div>
            <div id="purchaseExtraEmpty" class="cost-extra-empty">Belum ada biaya tambahan.</div>
          </div>
        </div>
        <div class="field full"><div class="quick-note" id="purchaseCostSummary">Nilai barang: Rp0<br>Biaya tambahan: Rp0<br><b>Total modal lot: Rp0</b><br>HPP lot: Rp0 / satuan</div></div>
        ${fieldHTML('payment_status','Pembayaran','select','<option value="PAID">Lunas</option><option value="UNPAID">Belum Lunas</option><option value="PARTIAL">Sebagian</option>')}
        ${fieldHTML('notes','Catatan','textarea')}
       </div>`,
      async()=>{
        const supplier=document.getElementById('f_supplier').value;
        const product=document.getElementById('f_product').value;
        const qtyActual=Number(document.getElementById('f_qty_actual').value||0);
        const qtyInvoice=Number(document.getElementById('f_qty_invoice').value||0);
        const unit=document.getElementById('f_unit').value;
        const mode=document.getElementById('f_price_mode').value;
        const unitPriceInput=Number(document.getElementById('f_unit_price').value||0);
        const totalPurchaseInput=Number(document.getElementById('f_total_purchase').value||0);
        const extraCosts=getPurchaseExtraCosts();
        const extraTotal=extraCosts.reduce((sum,x)=>sum+Number(x.amount||0),0);
        const goodsCost=mode==='TOTAL'?totalPurchaseInput:(qtyActual*unitPriceInput);
        const price=qtyActual?goodsCost/qtyActual:0;
        if(!supplier||!product||!qtyActual||!unit||goodsCost<=0){toast('Supplier, barang, qty aktual, satuan, dan nilai pembelian wajib diisi');return}
        if(extraTotal<0){toast('Biaya tambahan tidak boleh negatif');return}

        const productRow=products.find(x=>x.id===product);
        const code=humanCode('PO');
        const landedCost=goodsCost+extraTotal;
        const extraNote=extraCosts.length?`Biaya tambahan: ${extraCosts.map(x=>`${x.name} Rp${Number(x.amount||0).toLocaleString('id-ID')}`).join(' | ')}`:'';
        const baseNotes=document.getElementById('f_notes').value.trim();
        const finalNotes=[baseNotes,extraNote].filter(Boolean).join('\n');
        const landedUnitCost=qtyActual?landedCost/qtyActual:0;
        const d=new Date(document.getElementById('f_purchase_date').value||new Date());
        const p=n=>String(n).padStart(2,'0');
        const lotPrefix=(productRow?.code||'LOT').toUpperCase().replace(/[^A-Z0-9]/g,'');
        const lotCode=`${lotPrefix}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${String(Date.now()).slice(-3)}`;

        try{
          const totalCost=landedCost;
          const h=await post({action:'create_purchase',supplier_id:supplier,produk_id:product,satuan_id:unit,qty:qtyActual,harga:landedUnitCost,status_pembayaran:document.getElementById('f_payment_status').value==='PAID'?'Lunas':document.getElementById('f_payment_status').value==='PARTIAL'?'Sebagian':'Belum Lunas',jumlah_dibayar:document.getElementById('f_payment_status').value==='PAID'?totalCost:0,catatan:finalNotes,request_id:humanCode('REQ')});
          closeModal();toast(`Pembelian ${code} tersimpan • Lot ${lotCode}`);modulePage('purchases');
        }catch(e){toast(e.message)}
      });
    document.getElementById('f_purchase_date').value=new Date().toISOString().slice(0,10);

    window.updatePurchaseCost=()=>{
      const qty=Number(document.getElementById('f_qty_actual')?.value||0);
      const mode=document.getElementById('f_price_mode')?.value||'UNIT';
      const unitPrice=Number(document.getElementById('f_unit_price')?.value||0);
      const totalPurchase=Number(document.getElementById('f_total_purchase')?.value||0);
      const extraTotal=getPurchaseExtraCosts().reduce((sum,x)=>sum+Number(x.amount||0),0);
      const goods=mode==='TOTAL'?totalPurchase:(qty*unitPrice),total=goods+extraTotal,hpp=qty?total/qty:0,effective=qty?(goods/qty):0;
      const el=document.getElementById('purchaseCostSummary');
      const ep=document.getElementById('effectiveUnitPrice');
      if(ep)ep.innerHTML=`HPP barang per satuan: <b>${money(effective)}</b>`;
      if(el)el.innerHTML=`Nilai barang: ${money(goods)}<br>Biaya tambahan: ${money(extraTotal)}<br><b>Total modal lot: ${money(total)}</b><br>HPP lot: ${money(hpp)} / satuan`;
    };
    const togglePriceMode=()=>{
      const mode=document.getElementById('f_price_mode')?.value||'UNIT';
      const unitBox=document.getElementById('unitPriceField');
      const totalBox=document.getElementById('totalPriceField');
      if(unitBox)unitBox.style.display=mode==='UNIT'?'':'none';
      if(totalBox)totalBox.style.display=mode==='TOTAL'?'':'none';
      window.updatePurchaseCost();
    };
    document.getElementById('f_price_mode').addEventListener('change',togglePriceMode);
    ['f_qty_invoice','f_qty_actual','f_unit_price','f_total_purchase'].forEach(id=>{
      document.getElementById(id).addEventListener('input',window.updatePurchaseCost);
    });
    document.getElementById('f_qty_invoice').oninput=e=>{
      if(!document.getElementById('f_qty_actual').value)document.getElementById('f_qty_actual').value=e.target.value;
      window.updatePurchaseCost();
    };
    togglePriceMode();
  }catch(e){toast(e.message)}
}

        ${fieldHTML('customer','Customer','select',selectOptions(customers,'id',x=>x.name,'Pilih customer...'))}
        ${fieldHTML('product','Produk','select',selectOptions(products,'id',x=>x.name,'Pilih produk...'))}
        ${fieldHTML('qty','Qty','number')}
        ${fieldHTML('unit_price','Harga Jual','number')}
        ${fieldHTML('payment_status','Pembayaran','select','<option value="PAID">Lunas</option><option value="UNPAID">Belum Lunas</option><option value="PARTIAL">Sebagian</option>')}
        ${fieldHTML('notes','Catatan','textarea')}
      </div>`;
    }else{
      body=`<div class="quick-note">${c.note}</div><div class="form">
        ${fieldHTML('transaction_date','Tanggal','date')}
        ${fieldHTML('transaction_type','Jenis','select','<option value="INCOME">Pemasukan</option><option value="EXPENSE">Pengeluaran</option><option value="CAPITAL">Modal</option><option value="WITHDRAWAL">Prive</option>')}
        ${fieldHTML('account','Akun','select',selectOptions(accounts,'id',x=>x.name,'Pilih akun...'))}
        ${fieldHTML('amount','Nominal','number')}
        ${fieldHTML('direction','Arus','select','<option value="IN">Masuk</option><option value="OUT">Keluar</option>')}
        ${fieldHTML('description','Keterangan','textarea')}
      </div>`;
    }
    openEmployeeModal(c.title,body,async()=>{
      try{
        let data={};
        if(page==='production'){
      const availableLots=await loadAvailableLots(products);
      window.currentProductionLots=availableLots;
      body=`<div class="quick-note"><b>Produksi dicatat sebagai batch.</b><br>Untuk bahan, pilih hanya lot yang masih punya stok. Lot dengan stok 0 otomatis tidak muncul. Setelah lot dipilih, stok tersedia dan HPP/unit ditampilkan otomatis.</div>
        <div class="section-label">Info Produksi</div><div class="form">
          ${fieldHTML('production_date','Tanggal','date')}
          ${fieldHTML('production_type','Jenis Produksi','select','<option value="">Pilih jenis...</option><option value="ADONAN">Adonan Dasar</option><option value="PRODUK_JADI">Produk Jadi</option>')}
          ${fieldHTML('production_name','Nama Produksi','select',selectOptions(products,'id',x=>x.name,'Pilih produk...'))}
        </div>
        <div class="section-label">Bahan yang Dipakai</div>
        <div id="prodInputs" class="stack"></div>
        <button class="btn soft" type="button" onclick="addProdInput()">+ Tambah Lot Bahan</button>
        <div class="section-label">Hasil Aktual</div>
        <div id="prodOutputs" class="stack"></div>
        <button class="btn soft" type="button" onclick="addProdOutput()">+ Tambah Output / Size</button>
        <div class="prod-total panel"><div class="row"><span>Total HPP Batch</span><b id="prodTotal">Rp0</b></div><div class="row"><span>Total Output</span><b id="prodOutputTotal">0</b></div></div>
        ${fieldHTML('notes','Catatan','textarea')}`;
    }else if(page==='supply'){
          const code=humanCode('SUPPLY');
          const qty=Number(document.getElementById('f_qty').value||0),price=Number(document.getElementById('f_unit_price').value||0);
          data={supply_code:code,supply_date:document.getElementById('f_supply_date').value,customer_id:document.getElementById('f_customer').value,total_amount:qty*price,total_cost:0,gross_profit:qty*price,payment_status:document.getElementById('f_payment_status').value,payment_account_id:'',notes:document.getElementById('f_notes').value.trim()};
        }else{
          data={transaction_code:humanCode('TRX'),transaction_date:document.getElementById('f_transaction_date').value,transaction_type:document.getElementById('f_transaction_type').value,account_id:document.getElementById('f_account').value,amount:Number(document.getElementById('f_amount').value||0),direction:document.getElementById('f_direction').value,description:document.getElementById('f_description').value.trim()};
        }
        await post({action:'create',table:c.table,data});
        closeModal();toast('Data tersimpan');modulePage(page);
      }catch(e){toast(e.message)}
    });
    if(document.getElementById('f_production_date'))document.getElementById('f_production_date').value=new Date().toISOString().slice(0,10);
    if(document.getElementById('f_processing_date'))document.getElementById('f_processing_date').value=new Date().toISOString().slice(0,10);
    if(document.getElementById('f_supply_date'))document.getElementById('f_supply_date').value=new Date().toISOString().slice(0,10);
    if(document.getElementById('f_transaction_date'))document.getElementById('f_transaction_date').value=new Date().toISOString().slice(0,10);
    if(page==='production'){ addProdInput(); addProdOutput(); }
  }catch(e){toast(e.message)}
}
function addProdInput(){
  const wrap=document.getElementById('prodInputs'); if(!wrap)return;
  const lots=window.currentProductionLots||[];
  if(!lots.length){
    wrap.insertAdjacentHTML('beforeend',`<div class="detail-card prod-input"><b>Tidak ada lot tersedia</b><div class="muted" style="margin-top:5px">Semua lot stoknya 0 atau belum ada lot masuk.</div></div>`);
    calcProd(); return;
  }
  const row=document.createElement('div'); row.className='detail-card prod-input';
  row.innerHTML=`<div class="form">
    <div class="field full"><label>Lot Bahan</label><select class="pi-lot">${lotOptions(lots)}</select></div>
    <div class="field"><label>Stok Tersedia</label><input class="pi-stock" readonly placeholder="-"></div>
    <div class="field"><label>Qty Dipakai</label><input class="pi-qty" type="number" step="0.001" min="0" placeholder="0"></div>
    <div class="field"><label>Satuan</label><input class="pi-unit" readonly placeholder="-"></div>
    <div class="field"><label>HPP / Satuan</label><input class="pi-hpp" readonly placeholder="Rp0"></div>
    <div class="field full"><div class="quick-note pi-summary">Pilih lot terlebih dahulu.</div></div>
  </div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn danger mini" type="button">Hapus Lot</button></div>`;
  wrap.appendChild(row);
  const sel=row.querySelector('.pi-lot'),qty=row.querySelector('.pi-qty'),stock=row.querySelector('.pi-stock'),unit=row.querySelector('.pi-unit'),hpp=row.querySelector('.pi-hpp'),summary=row.querySelector('.pi-summary');
  const syncLot=()=>{
    const opt=sel.options[sel.selectedIndex],available=Number(opt?.dataset.qty||0),unitVal=opt?.dataset.unit||'',hppVal=Number(opt?.dataset.hpp||0),used=Number(qty.value||0);
    stock.value=available?num(available):'-'; unit.value=unitVal||'-'; hpp.value=hppVal?money(hppVal):'Rp0'; qty.max=available||'';
    if(used>available)qty.value=available||0;
    const actualUsed=Number(qty.value||0);
    summary.innerHTML=opt?.value?`<b>${esc(opt.textContent||'')}</b><br>Stok tersisa setelah dipakai: <b>${num(Math.max(available-actualUsed,0))} ${esc(unitVal)}</b>`:'Pilih lot terlebih dahulu.';
    calcProd();
  };
  sel.addEventListener('change',syncLot);
  qty.addEventListener('input',()=>{const available=Number(sel.options[sel.selectedIndex]?.dataset.qty||0);if(Number(qty.value||0)>available){qty.value=available;toast(`Qty tidak boleh melebihi stok lot (${num(available)})`)}syncLot()});
  row.querySelector('.btn.danger').onclick=()=>{row.remove();calcProd()}; syncLot();
}
function addProdOutput(){
  const wrap=document.getElementById('prodOutputs'); if(!wrap)return;
  wrap.insertAdjacentHTML('beforeend',`<div class="prod-output mini-grid"><input class="po-name" placeholder="Produk / output"><input class="po-size" placeholder="Size / grade (opsional)"><input class="po-qty" type="number" step="0.001" placeholder="Qty"><input class="po-unit" placeholder="pcs / kg / box"><button class="btn danger mini" type="button" onclick="this.parentElement.remove();calcProd()">×</button></div>`);
  wrap.lastElementChild.querySelectorAll('input').forEach(x=>x.oninput=calcProd); calcProd();
}
function calcProd(){
  const inputs=[...document.querySelectorAll('.prod-input')]; const outputs=[...document.querySelectorAll('.prod-output')];
  const cost=inputs.reduce((a,r)=>{const qty=Number(r.querySelector('.pi-qty')?.value||0),sel=r.querySelector('.pi-lot'),hpp=Number(sel?.options[sel.selectedIndex]?.dataset.hpp||0);return a+(qty*hpp)},0);
  const qty=outputs.reduce((a,r)=>a+Number(r.querySelector('.po-qty')?.value||0),0);
  if(document.getElementById('prodTotal'))document.getElementById('prodTotal').textContent=money(cost);
  if(document.getElementById('prodOutputTotal'))document.getElementById('prodOutputTotal').textContent=num(qty);
}



async function modulePage(page){
  conn('on');
  if(page==='purchases'){
    app.innerHTML=`<div class="toolbar"><input class="search" id="q" placeholder="Cari nomor pembelian atau supplier..."><button class="btn primary" onclick="purchaseForm()">+ Pembelian Baru</button></div><div class="quick-note">Operator tidak perlu tahu ID pembelian, ID supplier, atau UUID. Semua nomor dibuat otomatis oleh sistem.</div><div class="tablebox"><table><thead><tr><th>No Pembelian</th><th>Tanggal</th><th>Supplier</th><th>Qty Aktual</th><th>Total</th><th>Pembayaran</th></tr></thead><tbody id="tb"><tr><td colspan="6" class="empty">Memuat...</td></tr></tbody></table></div>`;
    try{
      const [rows,suppliers]=await Promise.all([get({action:'list',table:'PURCHASE',limit:300}).then(x=>x.data?.rows||[]),loadMasterRows('MST_SUPPLIER')]);
      const sm=Object.fromEntries(suppliers.map(x=>[x.id,x.name]));
      const draw=()=>{const q=(document.getElementById('q').value||'').toLowerCase(),rr=rows.filter(x=>`${x.purchase_code||''} ${sm[x.supplier_id]||''}`.toLowerCase().includes(q));document.getElementById('tb').innerHTML=rr.length?rr.map(x=>`<tr><td><b>${esc(x.purchase_code||'-')}</b></td><td>${esc(x.purchase_date||'-')}</td><td>${esc(sm[x.supplier_id]||'Supplier')}</td><td>${num(x.actual_qty)} ${esc(x.unit_id||'')}</td><td>${money(x.total_amount)}</td><td><span class="badge">${esc(x.payment_status||'-')}</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada pembelian.</td></tr>'};draw();document.getElementById('q').oninput=draw;
    }catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`}
    return;
  }
  if(['processing','production','supply','finance'].includes(page)){
    app.innerHTML=`<div class="toolbar"><div></div><button class="btn primary" onclick="genericOperationForm('${page}')">+ Input ${pages[page][0]}</button></div><div class="quick-note">Tampilan ini sengaja dibuat sederhana untuk karyawan. Detail ID, UUID, dan relasi database dikelola sistem di belakang layar.</div><div class="panel empty">Belum ada tampilan riwayat yang diaktifkan pada layar ini. Gunakan tombol input untuk mencatat transaksi.</div>`;
    return;
  }
  app.innerHTML=`<div class="panel empty">${pages[page][0]} siap digunakan.</div>`;
}

/* Supplier page: human-readable, no forced code entry */
async function master(page){
  const c=masters[page];conn('wait');app.innerHTML='<div class="panel empty">Memuat data...</div>';
  try{
    const rows=await loadMasterRows(c.table);conn('on');
    if(page==='suppliers'){
      app.innerHTML=`<div class="toolbar"><input class="search" id="q" placeholder="Cari nama supplier..."><button class="btn primary" onclick="supplierForm()">+ Supplier Baru</button></div><div class="quick-note">Daftar supplier tampil di aplikasi. Kode supplier dibuat otomatis dan tidak perlu diketahui saat transaksi.</div><div class="tablebox"><table><thead><tr><th>Supplier</th><th>No. HP</th><th>Alamat</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>`;
      const draw=()=>{const q=(document.getElementById('q').value||'').toLowerCase(),rr=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('tb').innerHTML=rr.length?rr.map(x=>`<tr><td><b>${esc(x.name||'-')}</b><div class="muted">${esc(x.code||'')}</div></td><td>${esc(x.phone||'-')}</td><td>${esc(x.address||'-')}</td><td><span class="badge">${esc(x.status||'-')}</span></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada supplier.</td></tr>'};draw();document.getElementById('q').oninput=draw;return;
    }
    app.innerHTML=`<div class="toolbar"><input class="search" id="q" placeholder="Cari ${c.label.toLowerCase()}..."><button class="btn primary" onclick="openForm('${page}')">+ Tambah ${c.label}</button></div><div class="tablebox"><table><thead><tr>${c.cols.map(x=>`<th>${label(x)}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div>`;
    const draw=()=>{const q=(document.getElementById('q').value||'').toLowerCase(),rr=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('tb').innerHTML=rr.length?rr.map(x=>`<tr>${c.cols.map(k=>`<td>${k==='status'?`<span class="badge">${esc(x[k]||'-')}</span>`:esc(x[k]??'')}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="'+c.cols.length+'" class="empty">Belum ada data.</td></tr>'};draw();document.getElementById('q').oninput=draw;
  }catch(e){conn('off');app.innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

go('dashboard');
</script></body></html>
